services:
  repo-express:
    build: .
    container_name: repo-express
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Simpan file di host: folder ./storage pada host di-mount ke /app/storage dalam container
      - ./storage:/app/storage
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - STORAGE_DIR=/app/storage
      - TITLE=Debian File Repository
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
