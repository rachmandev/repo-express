services:
  swirl-mirror:
    # Mengambil image dari GitHub Container Registry (GHCR)
    # Default ke 'latest', atau atur SWIRL_MIRROR_VERSION di file .env untuk versi tertentu (misal: v1.0.0)
    image: ghcr.io/rachmandev/swirl-mirror:${SWIRL_MIRROR_VERSION:-latest}
    # build: . # Uncomment jika ingin build sendiri dari source code secara lokal
    container_name: swirl-mirror
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Simpan file di host: folder ./storage pada host di-mount ke /app/storage dalam container
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      # Override folder penyimpanan agar mengarah ke direktori dalam container
      - STORAGE_DIR=/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
